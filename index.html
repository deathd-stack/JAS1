<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f26018">
<title>JAS DUTY SCHEDULE</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --orange:#ff6500;
  --orange2:#ff9348;
  --cream:#f1e5dd;
  --dark:#09090c;
  --panel:rgba(10,10,13,.93);
  --panel2:rgba(18,18,22,.94);
  --stroke:rgba(255,161,84,.25);
  --text:#fff;
  --muted:#aaaab3;
  --shadow:0 20px 42px rgba(0,0,0,.30);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{
  color:var(--text);
  background:
    radial-gradient(900px 400px at 50% 0%,rgba(255,122,0,.25),transparent 62%),
    linear-gradient(180deg,#f3e6dd 0%,#eadbd1 22%,#de7a31 76%,#a84611 100%);
  min-height:100vh;
  font-weight:800;
}
body:before{
  content:"JAS";
  position:fixed;left:50%;top:70px;transform:translateX(-50%);
  font-size:min(38vw,310px);font-weight:1000;letter-spacing:-15px;
  color:rgba(255,255,255,.09);pointer-events:none;z-index:0;
}
.app{position:relative;z-index:1;max-width:980px;margin:auto;padding:0 12px 100px}
header{text-align:center;padding:26px 10px 16px}
.title{
  display:flex;
  align-items:baseline;
  justify-content:center;
  gap:8px;
  white-space:nowrap;
  color:#ef5c18;
  text-shadow:0 2px 0 rgba(255,255,255,.2);
  line-height:1;
}
.titleJAS{
  font-size:clamp(38px,8vw,64px);
  font-weight:1000;
  letter-spacing:-2px;
}
.titleRest{
  font-size:clamp(19px,4vw,32px);
  font-weight:1000;
  letter-spacing:-1px;
}
.subTitle{font-size:13px;color:#7c3718;letter-spacing:2px;margin-top:4px}

.card{
  background:linear-gradient(135deg,rgba(255,145,70,.08),rgba(255,145,70,0) 25%),var(--panel);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  border-radius:28px;
  padding:14px;
  margin:10px 0;
  backdrop-filter:blur(14px);
}
.row{display:flex;gap:10px;align-items:center}
.control{
  flex:1;display:flex;align-items:center;gap:8px;min-width:0;
  background:#0b0b0e;border:1px solid var(--stroke);border-radius:22px;padding:9px 12px;
}
.control label{color:var(--orange2);font-size:13px;font-weight:1000;white-space:nowrap}
select,input{
  width:100%;min-width:0;height:42px;border-radius:15px;border:1px solid rgba(255,166,92,.22);
  background:#050507;color:#fff;padding:0 11px;font:inherit;font-weight:900;outline:none;
}
button,.fileBtn{
  border:1px solid rgba(255,164,86,.34);border-radius:20px;
  background:linear-gradient(180deg,#121216,#050507);color:#fff;
  padding:12px 15px;font:inherit;font-weight:1000;box-shadow:0 10px 20px rgba(0,0,0,.22);cursor:pointer;
}
button.active{background:linear-gradient(180deg,#ff8c37,#ff5d00);color:white;border-color:#ff994e}
.fileBtn{display:block;text-align:center;background:linear-gradient(180deg,#ff8c37,#ff5d00);cursor:pointer}
.fileBtn input{display:none}

.categories{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.categories button{padding:12px 4px;font-size:13px}
.scroll{display:flex;gap:7px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.scroll button{min-width:58px;padding:10px 12px;white-space:nowrap}
.persons button{min-width:max-content}

.info{
  margin-top:9px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.055);
  color:#ddd;font-size:12px;line-height:1.5;border:1px solid rgba(255,255,255,.05)
}
.mainName{color:var(--orange2);font-weight:1000}
.current{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;
}
.currentPerson{font-size:17px;font-weight:1000}
.monthBar{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 12px}
.monthBar button{padding:9px 13px;border-radius:999px;font-size:12px}
.monthLabel{
  min-width:150px;text-align:center;background:#0c0c10;border:1px solid var(--stroke);
  border-radius:999px;padding:10px 15px;font-size:15px;font-weight:1000;
}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{text-align:center;color:#e4cfc1;font-size:11px;padding:4px 0}
.day{
  min-height:95px;background:linear-gradient(180deg,#141419,#0b0b0e);
  border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:8px;cursor:pointer;
  position:relative;overflow:hidden;
}
.day:hover{border-color:rgba(255,145,70,.45)}
.day.blank{background:transparent;border-color:transparent;cursor:default}
.day.today{
  border-color:rgba(255,255,255,.07)!important;
  box-shadow:none!important;
}
.day.today .dayNum{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 5px;
  border-radius:999px;
  background:var(--orange);
  color:#fff!important;
}
.dayNum{font-size:12px;color:#ddd;font-weight:1000}
.code{
  margin-top:9px;
  text-align:center;
  color:#ff9c57;
  font-size:14px;
  font-weight:1000;
  word-break:keep-all;
  white-space:nowrap;
  line-height:1.15;
  padding:0;
  border-radius:0;
  background:transparent;
  border:none;
}

.codeOff{background:transparent;color:inherit;border:none;box-shadow:none;}

.codeLeave{background:transparent;color:inherit;border:none;box-shadow:none;}

.codeAll53{background:transparent;color:inherit;border:none;box-shadow:none;}

.codeSpecial{background:transparent;color:inherit;border:none;box-shadow:none;}
.sun .dayNum{color:#ff7b76}.sat .dayNum{color:#7ca7ff}
.edited:after{content:"EDIT";position:absolute;right:6px;bottom:5px;font-size:8px;color:#ff9c57;opacity:.7}


.dayNormal,
.dayOff,
.dayLeave,
.dayR,
.dayA,
.dayP{
  border-color:rgba(255,255,255,.07);
  box-shadow:none;
}

.dayOff::before,
.dayLeave::before,
.dayR::before,
.dayA::before,
.dayP::before{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:5px;
  height:4px;
  border-radius:999px;
}

/* 휴무 */
.dayOff::before{background:#d8dde5}

/* 연차 */
.dayLeave::before{background:#ffc247}

/* R14 / R43 */
.dayR::before{background:#b57dff}

/* A 계열 */
.dayA::before{background:#489eff}

/* P 계열 */
.dayP::before{background:#45d6a4}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:20;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  background:rgba(5,5,8,.88);border-top:1px solid rgba(255,160,80,.18);backdrop-filter:blur(14px)
}
.bottomInner{max-width:980px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.bottom button{padding:12px 7px}
.bottom .mainBtn{background:linear-gradient(180deg,#ff8c37,#ff5d00)}

.modal{
  position:fixed;inset:0;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);z-index:50;
}
.modal.show{display:flex}
.sheet{
  width:min(100%,520px);background:#111115;border-radius:28px 28px 0 0;padding:16px 15px calc(18px + env(safe-area-inset-bottom));
  border-top:1px solid var(--stroke);box-shadow:0 -16px 40px rgba(0,0,0,.35)
}
.handle{width:55px;height:6px;background:#45454d;border-radius:999px;margin:0 auto 13px}
.sheetTitle{text-align:center;font-size:16px;font-weight:1000;margin-bottom:12px}
.editInput{height:52px;text-align:center;font-size:18px}
.sheetActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}


.compactTopCard{
  padding:10px;
}

.topHalfGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.topHalfBox{
  min-width:0;
  background:
    linear-gradient(135deg,rgba(255,145,70,.07),rgba(255,145,70,0) 30%),
    #0b0b0e;
  border:1px solid var(--stroke);
  border-radius:20px;
  padding:10px;
}

.topHalfTitle{
  color:var(--orange2);
  font-size:12px;
  font-weight:1000;
  margin-bottom:7px;
  letter-spacing:.2px;
}

.mainCompactRow{
  display:grid;
  grid-template-columns:1fr;
  gap:6px;
  align-items:center;
}

.mainCompactRow select{
  height:38px;
  border-radius:13px;
  font-size:13px;
}

.compactActionBtn{
  height:38px;
  padding:0 12px;
  border-radius:13px;
  font-size:12px;
  white-space:nowrap;
}

.compactFileBtn{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 10px;
  border-radius:13px;
  font-size:13px;
  box-shadow:none;
}

.compactSubText{
  margin-top:7px;
  color:#aaaab3;
  font-size:10px;
  line-height:1.3;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.compactSubText .mainName{
  color:var(--orange2);
}


.searchFileGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.searchBtn{
  width:100%;
}

.searchResults{
  margin-top:10px;
  max-height:42vh;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.searchResultBtn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  text-align:left;
  padding:12px 14px;
  border-radius:16px;
  background:linear-gradient(180deg,#17171b,#0b0b0e);
}

.searchResultName{
  font-size:15px;
  font-weight:1000;
}

.searchResultUnit{
  font-size:11px;
  color:var(--orange2);
  white-space:nowrap;
}

.searchEmpty{
  text-align:center;
  color:#8d8d96;
  font-size:12px;
  padding:18px 8px;
  background:rgba(255,255,255,.04);
  border-radius:16px;
}

.searchSheet{
  max-height:90vh;
  overflow:auto;
}

.searchNavSection{
  margin-top:12px;
  padding:10px;
  border-radius:18px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.05);
}

.searchSectionTitle{
  margin:10px 0 6px;
  color:var(--orange2);
  font-size:11px;
  font-weight:1000;
  letter-spacing:.3px;
}

.searchCategories{
  grid-template-columns:repeat(5,1fr);
}

.searchCategories button{
  padding:9px 3px;
  font-size:11px;
  border-radius:13px;
}

.searchUnits{
  padding-top:3px;
}

.searchUnits button{
  padding:9px 11px;
  min-width:52px;
  border-radius:13px;
}

.searchPersons{
  padding-top:3px;
  flex-wrap:wrap;
  overflow:visible;
}

.searchPersons button{
  min-width:max-content;
  padding:9px 12px;
  border-radius:13px;
  font-size:12px;
}

@media(max-width:600px){
  .title{gap:5px}
  .titleJAS{font-size:40px}
  .titleRest{font-size:20px;letter-spacing:-.8px}

  .app{padding-left:8px;padding-right:8px}
  .topHalfGrid{grid-template-columns:1fr 1fr;gap:6px}
  .topHalfBox{padding:8px;border-radius:17px}
  .topHalfTitle{font-size:11px}
  .mainCompactRow select{font-size:11px;padding:0 7px}
  .compactActionBtn{padding:0 8px;font-size:11px}
  .compactFileBtn{font-size:12px}
  .compactSubText{font-size:9px}
  .card{border-radius:23px;padding:11px}
  .row.mainRow{display:grid;grid-template-columns:1fr}
  .categories{gap:5px}.categories button{font-size:11px;padding:11px 2px}
  .day{min-height:72px;border-radius:14px;padding:6px}
  .code{
    font-size:11px;
    margin-top:7px;
    padding:6px 3px;
    letter-spacing:-.3px;
  }
  .title{font-size:42px}
}
</style>

<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png?v=2">
<link rel="manifest" href="./manifest.webmanifest?v=2">

</head>
<body>

<div class="app">
<header>
  <div class="title"><span class="titleJAS">JAS</span><span class="titleRest">DUTY SCHEDULE</span></div>
</header>

<section class="card compactTopCard">
  <div class="topHalfGrid">

    <div class="topHalfBox">
      <div class="topHalfTitle">MAIN 설정</div>

      <div class="mainCompactRow">
        <button id="openMainPicker" class="compactActionBtn" style="width:100%">
          메인 선택
        </button>
      </div>

      <div class="compactSubText">
        MAIN : <span id="mainText" class="mainName">미설정</span>
      </div>
    </div>

    <div class="topHalfBox">
      <div class="topHalfTitle">SEARCH / EXCEL</div>

      <div class="searchFileGrid">
        <button id="openSearch" class="compactActionBtn searchBtn">검색</button>

        <button id="adminUploadBtn" class="fileBtn compactFileBtn" type="button">파일추가</button>
        <input id="excelFile" type="file" accept=".xls,.xlsx,.xlsm" style="display:none">
      </div>

      <div class="compactSubText" id="status">
        직원 찾기 또는 근무표 추가
      </div>
    </div>

  </div>
</section>


<section class="card">
  <div class="current">
    <div class="currentPerson" id="currentPerson">직원 미선택</div>
    <div style="font-size:11px;color:#b9b9bf">날짜를 누르면 수정</div>
  </div>
  <div class="monthBar">
    <button id="prevMonth">PREV</button>
    <div class="monthLabel" id="monthLabel">2026.08</div>
    <button id="nextMonth">NEXT</button>
  </div>
  <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
  <div class="calendar" id="calendar"></div>
</section>
</div>

<div class="bottom">
  <div class="bottomInner">
    <button id="todayBtn">TODAY</button>
    <button id="goMain" class="mainBtn">MAIN</button>
    <button id="resetEdit">수정 초기화</button>
  </div>
</div>




<div class="modal" id="adminPinModal">
  <div class="sheet" style="max-width:420px">
    <div class="handle"></div>
    <div class="sheetTitle">관리자 확인</div>
    <input id="adminPinInput" class="editInput" type="password" inputmode="numeric" maxlength="4" placeholder="비밀번호 4자리" autocomplete="off">
    <div class="compactSubText" id="adminPinMessage" style="text-align:center;margin:4px 0 10px">엑셀 업데이트 권한 확인</div>
    <div class="sheetActions">
      <button id="cancelAdminPin">CLOSE</button>
      <button id="confirmAdminPin" class="active">확인</button>
    </div>
  </div>
</div>

<div class="modal" id="mainPickerModal">
  <div class="sheet searchSheet">
    <div class="handle"></div>
    <div class="sheetTitle">MAIN 선택</div>

    <div class="searchSectionTitle">큰 카테고리</div>
    <div class="categories searchCategories" id="mainCategories"></div>

    <div class="searchSectionTitle">조 선택</div>
    <div class="scroll searchUnits" id="mainUnits"></div>

    <div class="searchSectionTitle">성명</div>
    <div class="scroll persons searchPersons" id="mainPersons"></div>

    <div class="sheetActions">
      <button id="closeMainPicker">CLOSE</button>
      <button id="clearMainPicker" class="active">초기화</button>
    </div>
  </div>
</div>

<div class="modal" id="searchModal">
  <div class="sheet searchSheet">
    <div class="handle"></div>
    <div class="sheetTitle">직원 찾기</div>

    <input id="searchNameInput" class="editInput" placeholder="성명을 입력하세요">

    <div class="searchNavSection">
      <div class="searchSectionTitle">구역 선택</div>
      <div class="categories searchCategories" id="searchCategories"></div>

      <div class="searchSectionTitle">조 선택</div>
      <div class="scroll searchUnits" id="searchUnits"></div>

      <div class="searchSectionTitle">인원</div>
      <div class="scroll persons searchPersons" id="searchPersons"></div>
    </div>

    <div class="searchSectionTitle">검색 결과</div>
    <div id="searchResults" class="searchResults">
      <div class="searchEmpty">이름을 입력하면 검색됩니다.</div>
    </div>

    <div class="sheetActions">
      <button id="closeSearch">CLOSE</button>
      <button id="clearSearch" class="active">검색 지우기</button>
    </div>
  </div>
</div>

<div class="modal" id="editModal">
  <div class="sheet">
    <div class="handle"></div>
    <div class="sheetTitle" id="editTitle">근무 수정</div>
    <input id="editInput" class="editInput" placeholder="예: A7 / P14 / R">
    <div class="sheetActions">
      <button id="cancelEdit">CLOSE</button>
      <button id="saveEdit" class="active">SAVE</button>
    </div>
  </div>
</div>

<script>
const STRUCTURE={
  "관리":["관리"],
  "소산":["소산1","소산2","소산3"],
  "1그룹":["1조","2조","3조","4조","5조","6조","7조","8조"],
  "2그룹":["9조","10조","11조","12조","13조","14조","15조","16조"],
  "3그룹":["17조","18조","19조","20조","21조","22조","23조","24조"]
};

let state={
  year:2026,
  month:8,
  people:{},
  schedules:{},
  blueA53:{},
  main:null,
  edits:{}
};

try{
  const saved=localStorage.getItem("JAS_DUTY_V1");
  if(saved) state=Object.assign(state,JSON.parse(saved));
}catch(e){}

state.blueA53=state.blueA53||{};

let currentCategory="1그룹";
let currentUnit="1조";
let currentPerson="";
let viewDate=new Date(state.year,state.month-1,1);
let editingDate="";

function persist(){
  try{
    localStorage.setItem("JAS_DUTY_V1",JSON.stringify(state));
    return true;
  }catch(e){return false}
}
function groupOf(unit){
  if(unit==="관리") return "관리";
  if(unit.startsWith("소산")) return "소산";
  const n=parseInt(unit);
  if(n<=8)return "1그룹";
  if(n<=16)return "2그룹";
  return "3그룹";
}
function dateKey(y,m,d){
  return `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function editKey(name,date){return name+"::"+date}
function displayCode(code){
  const v=String(code||"").trim().toUpperCase();

  if(v==="R") return "휴무";
  if(v==="L") return "연차";
  if(v==="RA43") return "R43";
  if(v==="RP14") return "R14";

  return v;
}

function scheduleClass(rawCode, shownCode){
  const raw=String(rawCode||"").trim().toUpperCase();

  // 1. 휴무
  if(raw==="R") return "dayOff";

  // 2. 연차
  if(raw==="L") return "dayLeave";

  // 3. R14 / R43
  if(raw==="RA43" || raw==="RP14" || shownCode==="R14" || shownCode==="R43")
    return "dayR";

  // 4. A로 시작하는 근무 (ALL53 포함)
  if(raw.startsWith("A") || shownCode==="ALL53")
    return "dayA";

  // 5. P로 시작하는 근무
  if(raw.startsWith("P"))
    return "dayP";

  return "dayNormal";
}

function getCode(name,date){
  const k=editKey(name,date);
  if(Object.prototype.hasOwnProperty.call(state.edits,k)) return state.edits[k];
  return (state.schedules[name]||{})[date]||"";
}
function pickFirst(){
  currentPerson=(state.people[currentUnit]||[])[0]||"";
}
function escapeHtml(v){
  return String(v||"").replace(/[&<>"']/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s]));
}

function renderSearchNav(){
  const catBox=document.getElementById("searchCategories");
  const unitBox=document.getElementById("searchUnits");
  const personBox=document.getElementById("searchPersons");

  if(!catBox||!unitBox||!personBox) return;

  catBox.innerHTML="";
  Object.keys(STRUCTURE).forEach(cat=>{
    const b=document.createElement("button");
    b.textContent=cat;
    b.className=cat===currentCategory?"active":"";
    b.onclick=()=>{
      currentCategory=cat;
      currentUnit=STRUCTURE[cat][0];
      pickFirst();
      renderSearchNav();
    };
    catBox.appendChild(b);
  });

  unitBox.innerHTML="";
  STRUCTURE[currentCategory].forEach(unit=>{
    const b=document.createElement("button");
    b.textContent=currentCategory.includes("그룹")?unit.replace("조",""):unit;

function renderCalendar(){
  const box=document.getElementById("calendar");
  box.innerHTML="";
  const y=viewDate.getFullYear(),m=viewDate.getMonth();
  document.getElementById("monthLabel").textContent=`${y}.${String(m+1).padStart(2,"0")}`;
  document.getElementById("currentPerson").textContent=currentPerson?`${currentUnit} · ${currentPerson}`:"직원 미선택";

  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();
  const now=new Date();

  for(let i=0;i<first;i++){
    const d=document.createElement("div");
    d.className="day blank";
    box.appendChild(d);
  }

  for(let day=1;day<=last;day++){
    const date=dateKey(y,m,day);
    const dow=new Date(y,m,day).getDay();
    const code=currentPerson?getCode(currentPerson,date):"";
    const blueA53Key=currentPerson?editKey(currentPerson,date):""; // 비흰색 A53 표시 키
    const shownCode=(/^A53$/i.test(String(code).trim()) && state.blueA53[blueA53Key]) ? "ALL53" : displayCode(code);
    const codeClass=scheduleClass(code,shownCode);
    const d=document.createElement("div");
    d.className="day "+codeClass+" "+(dow===0?"sun ":"")+(dow===6?"sat ":"");
    if(now.getFullYear()===y&&now.getMonth()===m&&now.getDate()===day)d.classList.add("today");
    if(currentPerson&&Object.prototype.hasOwnProperty.call(state.edits,editKey(currentPerson,date)))d.classList.add("edited");
    d.innerHTML=`<div class="dayNum">${day}</div><div class="code">${escapeHtml(shownCode)}</div>`;
    if(currentPerson)d.onclick=()=>openEdit(date);
    box.appendChild(d);
  }
}

const ADMIN_PIN="4656";
let firebaseUnsubscribe=null;

function applyRemoteSchedule(remote, year, month){
  if(!remote){
    state.year=year;
    state.month=month;
    state.people={};
    state.schedules={};
    state.blueA53={};
    persist();
    renderAll();
    document.getElementById("status").textContent=`ℹ️ ${year}년 ${month}월 공유 근무표 없음`;
    return;
  }

  state.year=Number(remote.year)||year;
  state.month=Number(remote.month)||month;
  state.people=remote.people||{};
  state.schedules=remote.schedules||{};
  state.blueA53=remote.blueA53||{};
  persist();

  if(state.main && (state.people[state.main.unit]||[]).includes(state.main.name)){
    currentCategory=state.main.category;
    currentUnit=state.main.unit;
    currentPerson=state.main.name;
  }else{
    const firstUnit=Object.keys(state.people)[0]||"관리";
    currentUnit=firstUnit;
    currentCategory=groupOf(firstUnit);
    pickFirst();
  }

  renderAll();
  document.getElementById("status").textContent=`☁️ ${state.year}년 ${state.month}월 공유 근무표 동기화 완료`;
}

function watchFirebaseMonth(year, month){
  if(!window.JASFirebase?.ready) return;

  if(firebaseUnsubscribe){
    try{ firebaseUnsubscribe(); }catch(e){}
    firebaseUnsubscribe=null;
  }

  firebaseUnsubscribe=window.JASFirebase.watchMonth(
    year,
    month,
    remote=>applyRemoteSchedule(remote, year, month),
    ()=>document.getElementById("status").textContent="⚠️ Firebase 읽기 권한/연결 확인 필요"
  );
}

function startFirebaseWatch(){
  if(window.JASFirebase?.ready){
    watchFirebaseMonth(viewDate.getFullYear(), viewDate.getMonth()+1);
  }
}

window.addEventListener("jasFirebaseReady", startFirebaseWatch);
setTimeout(startFirebaseWatch,1000);

document.getElementById("excelFile").addEventListener("change",async e=>{
  const file=e.target.files[0];
  if(!file)return;
  const status=document.getElementById("status");

  try{
    const wb=XLSX.read(await file.arrayBuffer(),{
      type:"array",
      raw:true,
      cellDates:true,
      cellStyles:true
    });
    const sheetName=wb.SheetNames.find(n=>n.includes("스케쥴")||n.includes("스케줄"))||wb.SheetNames[0];
    const ws=wb.Sheets[sheetName];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true});

    let year=parseInt(rows[0]?.[4])||state.year||2026;
    let month=parseInt(rows[0]?.[5])||state.month||8;
    if(month<1||month>12)month=8;

    let currentDuty="";
    const people={};
    const schedules={};
    const blueA53={};
    const a53StyleRecords=[];
    let personCount=0, scheduleCount=0;

    // 행 번호 고정 없이 표 구조로 자동 인식
    // B열에 관리/소산1~3/1~24조가 나오면 해당 구역 시작.
    // B열에 그 외 다른 구역명(신입/병가/육휴/파견/퇴사 등)이 나오면
    // 이전 조/구역 수집을 즉시 종료한다.
    const validDuty = v =>
      v==="관리" ||
      /^소산[1-3]$/.test(v) ||
      /^(?:[1-9]|1[0-9]|2[0-4])조$/.test(v);

    let insideMainTable=false;

    for(let r=0;r<rows.length;r++){
      const duty=String(rows[r]?.[1]??"").trim();
      const name=String(rows[r]?.[6]??"").trim();

      if(validDuty(duty)){
        currentDuty=duty;
        insideMainTable=true;
      }else if(duty && insideMainTable){
        // 관리/소산/1~24조가 아닌 새 구역명이 나타나면
        // 현재 조의 연속 구간이 끝난 것으로 처리
        currentDuty="";
        insideMainTable=false;
      }

      if(!insideMainTable || !currentDuty) continue;
      if(!name || name==="성명" || name.includes("합계")) continue;

      people[currentDuty]??=[];
      if(!people[currentDuty].includes(name)){
        people[currentDuty].push(name);
        personCount++;
      }

      schedules[name]??={};

      for(let day=1;day<=31;day++){
        const value=rows[r]?.[10+(day-1)]; // K열=1일, AO열=31일
        if(value===undefined||value===null||String(value).trim()==="")continue;

        const date=`${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        const code=String(value).trim();
        schedules[name][date]=code;

        // A53는 셀 스타일 ID로 구분한다.
        // 같은 파일 안에서 A53 셀들의 스타일 번호를 모은 뒤,
        // 가장 많이 쓰이는 스타일을 "일반 A53"으로 보고
        // 다른 스타일의 A53는 ALL53 후보로 저장한다.
        if(/^A53$/i.test(code)){
          const cellAddress=XLSX.utils.encode_cell({r:r,c:10+(day-1)});
          const cell=ws[cellAddress];

          let styleId=null;

          // SheetJS 버전에 따라 s가 숫자일 수도 있고 객체일 수도 있음
          if(cell){
            if(typeof cell.s==="number"){
              styleId=cell.s;
            }else if(cell.s && typeof cell.s==="object"){
              if(cell.s.numFmtId!==undefined || cell.s.fillId!==undefined || cell.s.fontId!==undefined || cell.s.borderId!==undefined){
                styleId=JSON.stringify({
                  numFmtId:cell.s.numFmtId??null,
                  fillId:cell.s.fillId??null,
                  fontId:cell.s.fontId??null,
                  borderId:cell.s.borderId??null,
                  alignment:cell.s.alignment??null
                });
              }else{
                styleId=JSON.stringify(cell.s);
              }
            }
          }

          if(styleId!==null){
            a53StyleRecords.push({
              person:name,
              date:date,
              styleId:String(styleId)
            });
          }
        }

        scheduleCount++;
      }
    }

    // A53 스타일 분류:
    // 가장 많이 등장한 스타일 = 일반 A53
    // 그 외 스타일 = ALL53
    if(a53StyleRecords.length){
      const counts={};
      a53StyleRecords.forEach(x=>{
        counts[x.styleId]=(counts[x.styleId]||0)+1;
      });

      let normalStyle=null;
      let maxCount=-1;
      Object.entries(counts).forEach(([styleId,count])=>{
        if(count>maxCount){
          maxCount=count;
          normalStyle=styleId;
        }
      });

      a53StyleRecords.forEach(x=>{
        if(x.styleId!==normalStyle){
          blueA53[editKey(x.person,x.date)]=true;
        }
      });
    }

    state.year=year;
    state.month=month;
    state.people=people;
    state.schedules=schedules;
    state.blueA53=blueA53;
    persist();

    viewDate=new Date(year,month-1,1);

    if(!(state.people[currentUnit]||[]).length){
      const firstUnit=Object.keys(people)[0]||"관리";
      currentUnit=firstUnit;
      currentCategory=groupOf(firstUnit);
    }
    pickFirst();
    renderAll();

    status.textContent=`⏳ ${personCount}명 확인 · Firebase 공유 중...`;
    try{
      await uploadCurrentScheduleToFirebase();
      status.textContent=`✅ ${year}년 ${month}월 전체 공유 완료 · ${personCount}명`;
      viewDate=new Date(year,month-1,1);
      watchFirebaseMonth(year,month);
    }catch(syncErr){
      console.error(syncErr);
      status.textContent="⚠️ 엑셀은 읽었지만 Firebase 저장 실패 · Firestore 권한 확인 필요";
    }
  }catch(err){
    console.error(err);
    status.textContent="❌ 엑셀을 읽지 못했습니다.";
  }
});
