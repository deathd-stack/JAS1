<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SKD Calendar</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      color: #181818;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      padding-bottom: 90px;
    }

    header {
      padding: 16px 12px 8px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
    }

    .card {
      background: white;
      margin: 8px;
      padding: 12px;
      border-radius: 18px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 800;
    }

    .category {
      padding: 11px 4px;
      border-radius: 12px;
      background: #eeeeef;
    }

    .category.active {
      background: #ff6500;
      color: white;
    }

    .scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-top: 10px;
    }

    .unit,
    .person {
      min-width: 58px;
      padding: 10px;
      border-radius: 11px;
      background: #eff0f2;
      white-space: nowrap;
    }

    .unit.active,
    .person.active {
      background: #111;
      color: white;
    }

    .main-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
    }

    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 12px;
      background: white;
    }

    .orange {
      background: #ff6500;
      color: white;
      padding: 12px;
      border-radius: 12px;
    }

    .black {
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 12px;
    }

    .upload {
      display: block;
      text-align: center;
      background: #ff6500;
      color: white;
      border-radius: 12px;
      padding: 13px;
      font-weight: 900;
    }

    input[type=file] {
      display: none;
    }

    #status {
      margin-top: 10px;
      background: #f6f6f7;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      color: #666;
    }

    .current {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .monthbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .monthbar button {
      width: 42px;
      height: 38px;
      border-radius: 10px;
      font-size: 20px;
    }

    .month-title {
      font-size: 20px;
      font-weight: 900;
    }

    .week,
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .week {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .day {
      min-height: 82px;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 6px;
      background: white;
    }

    .blank {
      border: none;
      background: transparent;
    }

    .today {
      border: 2px solid #ff6500;
    }

    .number {
      font-size: 12px;
      font-weight: 900;
    }

    .code {
      margin-top: 8px;
      color: #ff6500;
      font-size: 12px;
      font-weight: 900;
      word-break: break-all;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      border-top: 1px solid #ddd;
    }

    .bottom-inner {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    dialog {
      border: 0;
      border-radius: 20px;
      width: min(90vw, 420px);
    }

    dialog input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 11px;
      margin-bottom: 12px;
    }

    .dialog-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    @media(max-width: 600px) {
      .category {
        font-size: 12px;
      }

      .day {
        min-height: 72px;
      }

      .code {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>SKD CALENDAR</h1>
  </header>

  <div class="card">

    <div class="main-box">
      <select id="mainSelect">
        <option value="">본인 선택</option>
      </select>

      <button class="black" id="saveMain">
        MAIN 저장
      </button>
    </div>

    <div id="mainText">
      MAIN 미설정
    </div>

  </div>

  <div class="card">

    <div class="categories" id="categories"></div>

    <div class="scroll" id="units"></div>

    <div class="scroll" id="people"></div>

  </div>

  <div class="card">

    <label class="upload">
      엑셀 파일 추가

      <input
        id="excelFile"
        type="file"
        accept=".xls,.xlsx,.xlsm"
      >

    </label>

    <div id="status">
      엑셀 파일을 추가해주세요.
    </div>

  </div>

  <div class="card">

    <div class="current" id="currentPerson">
      직원 미선택
    </div>

    <div class="monthbar">

      <button id="prevMonth">
        ‹
      </button>

      <div
        id="monthTitle"
        class="month-title">
      </div>

      <button id="nextMonth">
        ›
      </button>

    </div>

    <div class="week">

      <div>일</div>
      <div>월</div>
      <div>화</div>
      <div>수</div>
      <div>목</div>
      <div>금</div>
      <div>토</div>

    </div>

    <div
      id="calendar"
      class="calendar">
    </div>

  </div>

</div>


<div class="bottom">

  <div class="bottom-inner">

    <button
      class="black"
      id="goMain">

      MAIN

    </button>

    <button
      class="orange"
      id="today">

      오늘

    </button>

  </div>

</div>


<dialog id="editDialog">

  <h3 id="editTitle">
    스케줄 수정
  </h3>

  <input
    id="editCode"
    placeholder="예: A7, P14, R"
  >

  <div class="dialog-buttons">

    <button
      onclick="editDialog.close()">

      취소

    </button>

    <button
      class="orange"
      id="saveEdit">

      저장

    </button>

  </div>

</dialog>


<script>

const structure = {

  "관리": [
    "관리"
  ],

  "소산": [
    "소산1",
    "소산2",
    "소산3"
  ],

  "1그룹": [
    "1조",
    "2조",
    "3조",
    "4조",
    "5조",
    "6조",
    "7조",
    "8조"
  ],

  "2그룹": [
    "9조",
    "10조",
    "11조",
    "12조",
    "13조",
    "14조",
    "15조",
    "16조"
  ],

  "3그룹": [
    "17조",
    "18조",
    "19조",
    "20조",
    "21조",
    "22조",
    "23조",
    "24조"
  ]

};


let data = {

  year: 2026,

  month: 8,

  people: {},

  schedules: {},

  main: null,

  edits: {}

};


try {

  const saved =
    localStorage.getItem("SKD_APP_DATA");

  if(saved) {

    data =
      Object.assign(
        data,
        JSON.parse(saved)
      );

  }

} catch(e) {}


let currentCategory =
  "1그룹";

let currentUnit =
  "1조";

let currentPerson =
  "";

let currentMonth =
  new Date(
    data.year,
    data.month - 1,
    1
  );

let editingDate =
  "";


function saveLocal() {

  try {

    localStorage.setItem(
      "SKD_APP_DATA",
      JSON.stringify(data)
    );

  } catch(e) {}

}


function getCategory(unit) {

  if(unit === "관리")
    return "관리";

  if(unit.startsWith("소산"))
    return "소산";

  const n =
    parseInt(unit);

  if(n <= 8)
    return "1그룹";

  if(n <= 16)
    return "2그룹";

  return "3그룹";

}


function renderCategories() {

  const box =
    document.getElementById(
      "categories"
    );

  box.innerHTML = "";

  Object.keys(
    structure
  ).forEach(cat => {

    const btn =
      document.createElement(
        "button"
      );

    btn.textContent =
      cat;

    btn.className =
      "category " +
      (
        cat ===
        currentCategory
          ? "active"
          : ""
      );

    btn.onclick = () => {

      currentCategory =
        cat;

      currentUnit =
        structure[cat][0];

      chooseFirstPerson();

      render();

    };

    box.appendChild(btn);

  });

}


function renderUnits() {

  const box =
    document.getElementById(
      "units"
    );

  box.innerHTML = "";

  structure[
    currentCategory
  ].forEach(unit => {

    const btn =
      document.createElement(
        "button"
      );

    btn.className =
      "unit " +
      (
        unit ===
        currentUnit
          ? "active"
          : ""
      );

    btn.textContent =
      currentCategory.includes(
        "그룹"
      )
        ? unit.replace("조","")
        : unit;

    btn.onclick = () => {

      currentUnit =
        unit;

      chooseFirstPerson();

      render();

    };

    box.appendChild(btn);

  });

}


function renderPeople() {

  const box =
    document.getElementById(
      "people"
    );

  box.innerHTML = "";

  const list =
    data.people[
      currentUnit
    ] || [];

  if(
    !list.includes(
      currentPerson
    )
  ) {

    currentPerson =
      list[0] || "";

  }

  list.forEach(name => {

    const btn =
      document.createElement(
        "button"
      );

    btn.textContent =
      name;

    btn.className =
      "person " +
      (
        name ===
        currentPerson
          ? "active"
          : ""
      );

    btn.onclick = () => {

      currentPerson =
        name;

      render();

    };

    box.appendChild(btn);

  });

}


function chooseFirstPerson() {

  currentPerson =
    (
      data.people[
        currentUnit
      ] || []
    )[0] || "";

}


function getDateKey(
  year,
  month,
  day
) {

  return (
    year +
    "-" +
    String(
      month + 1
    ).padStart(
      2,
      "0"
    ) +
    "-" +
    String(
      day
    ).padStart(
      2,
      "0"
    )
  );

}


function getSchedule(
  name,
  date
) {

  const editKey =
    name +
    "::" +
    date;

  if(
    data.edits[
      editKey
    ] !== undefined
  ) {

    return data.edits[
      editKey
    ];

  }

  return (
    data.schedules[
      name
    ] || {}
  )[date] || "";

}


function renderCalendar() {

  const calendar =
    document.getElementById(
      "calendar"
    );

  calendar.innerHTML =
    "";

  const y =
    currentMonth.getFullYear();

  const m =
    currentMonth.getMonth();

  document.getElementById(
    "monthTitle"
  ).textContent =
    `${y}년 ${m + 1}월`;

  document.getElementById(
    "currentPerson"
  ).textContent =
    currentPerson
      ? `${currentUnit} · ${currentPerson}`
      : "직원 미선택";


  const firstDay =
    new Date(
      y,
      m,
      1
    ).getDay();

  const lastDay =
    new Date(
      y,
      m + 1,
      0
    ).getDate();


  for(
    let i = 0;
    i < firstDay;
    i++
  ) {

    const blank =
      document.createElement(
        "div"
      );

    blank.className =
      "day blank";

    calendar.appendChild(
      blank
    );

  }


  const today =
    new Date();


  for(
    let day = 1;
    day <= lastDay;
    day++
  ) {

    const date =
      getDateKey(
        y,
        m,
        day
      );

    const code =
      currentPerson
        ? getSchedule(
            currentPerson,
            date
          )
        : "";


    const div =
      document.createElement(
        "div"
      );

    div.className =
      "day";


    if(
      today.getFullYear() === y &&
      today.getMonth() === m &&
      today.getDate() === day
    ) {

      div.classList.add(
        "today"
      );

    }


    div.innerHTML =
      `
      <div class="number">
        ${day}
      </div>

      <div class="code">
        ${code}
      </div>
      `;


    if(currentPerson) {

      div.onclick = () => {

        editingDate =
          date;

        document.getElementById(
          "editTitle"
        ).textContent =
          `${currentPerson} · ${date}`;

        document.getElementById(
          "editCode"
        ).value =
          code;

        editDialog.showModal();

      };

    }


    calendar.appendChild(
      div
    );

  }

}


function renderMainSelect() {

  const select =
    document.getElementById(
      "mainSelect"
    );

  select.innerHTML =
    '<option value="">본인 선택</option>';


  Object.entries(
    data.people
  ).forEach(
    ([unit,names]) => {

      names.forEach(
        name => {

          const option =
            document.createElement(
              "option"
            );

          option.value =
            JSON.stringify({
              name,
              unit,
              category:
                getCategory(
                  unit
                )
            });

          option.textContent =
            `${unit} · ${name}`;

          select.appendChild(
            option
          );

        }
      );

    }
  );


  if(data.main) {

    document.getElementById(
      "mainText"
    ).textContent =
      `MAIN : ${data.main.unit} · ${data.main.name}`;

  }

}


function render() {

  renderCategories();

  renderUnits();

  renderPeople();

  renderMainSelect();

  renderCalendar();

}


document.getElementById(
  "excelFile"
).addEventListener(
  "change",
  async function(e) {

    const file =
      e.target.files[0];

    if(!file)
      return;


    const status =
      document.getElementById(
        "status"
      );


    try {

      const buffer =
        await file.arrayBuffer();


      const workbook =
        XLSX.read(
          buffer,
          {
            type: "array"
          }
        );


      const sheetName =
        workbook.SheetNames.find(
          name =>
            name.includes(
              "스케쥴"
            ) ||
            name.includes(
              "스케줄"
            )
        ) ||
        workbook.SheetNames[0];


      const sheet =
        workbook.Sheets[
          sheetName
        ];


      const rows =
        XLSX.utils.sheet_to_json(
          sheet,
          {
            header: 1,
            defval: ""
          }
        );


      let currentDuty =
        "";

      const people =
        {};

      const schedules =
        {};


      let peopleCount =
        0;

      let scheduleCount =
        0;


      for(
        let r = 0;
        r < rows.length;
        r++
      ) {

        const duty =
          String(
            rows[r][1] || ""
          ).trim();


        const name =
          String(
            rows[r][6] || ""
          ).trim();


        if(
          duty === "관리" ||
          /^소산[1-3]$/.test(
            duty
          ) ||
          /^(?:[1-9]|1[0-9]|2[0-4])조$/.test(
            duty
          )
        ) {

          currentDuty =
            duty;

        }


        if(
          !name ||
          !currentDuty ||
          name === "성명"
        ) {

          continue;

        }


        if(
          !people[
            currentDuty
          ]
        ) {

          people[
            currentDuty
          ] = [];

        }


        if(
          !people[
            currentDuty
          ].includes(
            name
          )
        ) {

          people[
            currentDuty
          ].push(
            name
          );

          peopleCount++;

        }


        if(
          !schedules[
            name
          ]
        ) {

          schedules[
            name
          ] = {};

        }


        for(
          let day = 1;
          day <= 31;
          day++
        ) {

          /*
            K열 = index 10
            K = 1일
            L = 2일
            ...
            AO = 31일
          */

          const value =
            rows[r][
              10 +
              day -
              1
            ];


          if(
            value === undefined ||
            value === null ||
            String(value).trim() === ""
          ) {

            continue;

          }


          const date =
            `${data.year}-${String(data.month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;


          schedules[
            name
          ][date] =
            String(
              value
            ).trim();


          scheduleCount++;

        }

      }


      data.people =
        people;

      data.schedules =
        schedules;


      saveLocal();


      const firstUnit =
        Object.keys(
          people
        )[0];


      if(firstUnit) {

        currentUnit =
          firstUnit;

        currentCategory =
          getCategory(
            firstUnit
          );

        chooseFirstPerson();

      }


      render();


      status.textContent =
        `엑셀 읽기 완료 · 성명 ${peopleCount}명 · 스케줄 ${scheduleCount}개`;


    } catch(err) {

      console.error(
        err
      );

      status.textContent =
        "엑셀 파일을 읽지 못했습니다.";

    }

  }
);


document.getElementById(
  "saveMain"
).onclick = () => {

  const select =
    document.getElementById(
      "mainSelect"
    );


  if(!select.value) {

    alert(
      "본인 성명을 선택해주세요."
    );

    return;

  }


  const selected =
    JSON.parse(
      select.value
    );


  data.main =
    selected;


  currentCategory =
    selected.category;

  currentUnit =
    selected.unit;

  currentPerson =
    selected.name;


  saveLocal();


  document.getElementById(
    "mainText"
  ).textContent =
    `MAIN : ${selected.unit} · ${selected.name}`;


  render();

};


document.getElementById(
  "goMain"
).onclick = () => {

  if(!data.main) {

    alert(
      "MAIN을 먼저 설정해주세요."
    );

    return;

  }


  currentCategory =
    data.main.category;

  currentUnit =
    data.main.unit;

  currentPerson =
    data.main.name;


  render();

};


document.getElementById(
  "saveEdit"
).onclick = () => {

  if(
    !currentPerson ||
    !editingDate
  )
    return;


  const value =
    document.getElementById(
      "editCode"
    ).value.trim().toUpperCase();


  data.edits[
    currentPerson +
    "::" +
    editingDate
  ] =
    value;


  saveLocal();

  editDialog.close();

  renderCalendar();

};


document.getElementById(
  "prevMonth"
).onclick = () => {

  currentMonth.setMonth(
    currentMonth.getMonth()
    - 1
  );

  renderCalendar();

};


document.getElementById(
  "nextMonth"
).onclick = () => {

  currentMonth.setMonth(
    currentMonth.getMonth()
    + 1
  );

  renderCalendar();

};


document.getElementById(
  "today"
).onclick = () => {

  const now =
    new Date();

  currentMonth =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );

  renderCalendar();

};


if(data.main) {

  currentCategory =
    data.main.category;

  currentUnit =
    data.main.unit;

  currentPerson =
    data.main.name;

}


render();

</script>

</body>
</html>
